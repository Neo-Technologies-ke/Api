<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title></title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <style>
    html, body {
      margin: 0 auto !important;
      padding: 0 !important;
      height: 100% !important;
      width: 100% !important;
      background: #f1f1f1;
    }
    * {
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    div[style*="margin: 16px 0"] {
      margin: 0 !important;
    }
    table, td {
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
    }
    table {
      border-spacing: 0 !important;
      border-collapse: collapse !important;
      table-layout: fixed !important;
      margin: 0 auto !important;
    }
    table table table {
      table-layout: auto;
    }
    img {
      -ms-interpolation-mode:bicubic;
    }
    .yshortcuts a {
      mobile-web-app-capable: none;
      text-decoration: none !important;
    }
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }
    .preheader {
      display: none !important;
      visibility: hidden;
      mso-hide: all;
      font-size: 1px;
      color: #222222;
      line-height: 1px;
      max-height: 0px;
      max-width: 0px;
      opacity: 0;
      overflow: hidden;
    }
    #outlook a {
      padding: 0;
    }
    .ReadMsgBody {
      width: 100%;
    }
    .ExternalClass {
      width: 100%;
    }
    .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {
      line-height: 100%;
    }
    @media screen and (max-width: 480px) {
      .mobile-full {
        width: 100% !important;
        max-width: 100% !important;
      }
      .mobile-center {
        text-align: center !important;
      }
      .mobile-hide {
        display: none !important;
      }
    }
  </style>
</head>
<body style="margin: 0 !important; padding: 0 !important; background-color: #f1f1f1;">
  <div style="display: none; font-size: 1px; color: #fefefe; line-height: 1px; font-family: Arial, sans-serif; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
    Life Reformation Centre - {subject}
  </div>
  
  <table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center" style="background-color: #f1f1f1;" bgcolor="#f1f1f1">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
          <!-- Header -->
          <tr>
            <td align="center" valign="top" style="padding: 40px 20px 20px 20px; background-color: #ffffff;" bgcolor="#ffffff">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                <tr>
                  <td align="center" valign="top" style="padding-bottom: 15px;">
                    <div style="display: inline-block; background-color: #ffffff; padding: 10px; border-radius: 8px;">
                      <img src="https://admin.lifereformationcentre.org/images/logo-white.png" alt="Life Reformation Centre" width="140" style="display: block; margin: 0 auto; max-width: 140px; height: auto;">
                    </div>
                  </td>
                </tr>
                <tr>
                  <td align="center" valign="top" style="font-family: Lato, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; color: #2c3e50;">
                    Life Reformation Centre
                  </td>
                </tr>
                <tr>
                  <td align="center" valign="top" style="padding: 10px 0 0 0; font-family: Lato, Helvetica, Arial, sans-serif; font-size: 14px; font-style: italic; color: #95a5a6;">
                    In pursuit of God's heart
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Content -->
          <tr>
            <td align="center" valign="top" style="padding: 20px; background-color: #ffffff;" bgcolor="#ffffff">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                <tr>
                  <td align="left" valign="top" style="font-family: Lato, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #34495e;">
                    {contents}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Action Button -->
          <tr>
            <td align="center" valign="top" style="padding: 0 20px 20px 20px; background-color: #ffffff;" bgcolor="#ffffff">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                <tr>
                  <td align="center" valign="top">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center" style="border-radius: 6px; background-color: #3498db;" bgcolor="#3498db">
                          <a href="{appLink}" target="_blank" style="font-size: 16px; font-family: Lato, Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; border-radius: 6px; border: 1px solid #3498db; padding: 12px 24px; border-collapse: collapse; display: inline-block; font-weight: 600;">
                            {appName}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td align="center" valign="top" style="padding: 20px; background-color: #2c3e50;" bgcolor="#2c3e50">
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                <tr>
                  <td align="center" valign="top" style="font-family: Lato, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; color: #ecf0f1;">
                    <p style="margin: 0 0 10px 0;">
                      Life Reformation Centre
                    </p>
                    <p style="margin: 0 0 10px 0;">
                      <a href="https://lifereformationcentre.org" target="_blank" style="color: #3498db; text-decoration: underline;">
                        lifereformationcentre.org
                      </a>
                    </p>
                    <p style="margin: 0;">
                      © 2026 Life Reformation Centre. All rights reserved.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
